<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务中心</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/console-demo/images/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="/console-demo/images/favicon-64.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/console-demo/images/favicon-180.png?v=3">
  <style>
    html, body { margin: 0; height: 100%; background: #f4f7fb; }
    #app { min-height: 100%; background: #f4f7fb; }
    html.dark.gold body, html.dark.gold #app { background: #0f1115; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #f4f7fb;
    }
    html.dark.gold #boot { background: #0f1115; }
    .boot-inner {
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      transition: opacity .16s ease, transform .16s ease;
    }
    #boot.is-hide .boot-inner { opacity: 0; transform: translateY(-4px); pointer-events: none; }
    .boot-logo {
      width: 54px; height: 54px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border: 1px solid #e4eaf5;
      box-shadow: 0 10px 28px -14px rgba(36, 91, 219, .45);
    }
    .boot-logo img { width: 36px; height: 36px; object-fit: contain; display: block; }
    html.dark.gold .boot-logo { background: #1b1f27; border-color: #2a2f3a; }
    .boot-text { color: #667085; font: 500 12px/1.5 ui-sans-serif, system-ui, sans-serif; }
    html.dark.gold .boot-text { color: #98a2b3; }
    .boot-spin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid rgba(79, 124, 255, .18);
      border-top-color: #4f7cff;
      animation: bootspin .75s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }
  </style>
  <script>
    // 主题要在首帧前定好，避免闪白
    (function () {
      try {
        if (localStorage.getItem('auto_sjz.theme') === 'gold') {
          document.documentElement.classList.add('dark', 'gold');
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="/console-demo/assets/index-DFcdRo94.js"></script>
  <link rel="stylesheet" crossorigin href="/console-demo/assets/index-C1mqZXGy.css">
</head>
<body>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-logo"><img src="/console-demo/images/flame-boot.png" alt="炎火电竞"></div>
      <div class="boot-spin" aria-hidden="true"></div>
      <div class="boot-text">正在加载业务中心…</div>
    </div>
  </div>
  <div id="app"></div>
</body>
</html>
